<svg width="1100" height="650" viewBox="0 0 1100 650" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="border" x1="40" y1="20" x2="1060" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E3A8A"/>
      <stop offset="0.45" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2563EB" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="clip1"><rect x="44" y="86" width="0" height="28"><animate attributeName="width" from="0" to="970" dur="1.4s" begin="0.15s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip2"><rect x="44" y="124" width="0" height="90"><animate attributeName="width" from="0" to="970" dur="1.8s" begin="1.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip3"><rect x="44" y="236" width="0" height="28"><animate attributeName="width" from="0" to="970" dur="1.2s" begin="3.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip4"><rect x="44" y="274" width="0" height="132"><animate attributeName="width" from="0" to="970" dur="2.2s" begin="4.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip5"><rect x="44" y="432" width="0" height="28"><animate attributeName="width" from="0" to="970" dur="1.2s" begin="6.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip6"><rect x="44" y="470" width="0" height="90"><animate attributeName="width" from="0" to="970" dur="2.0s" begin="7.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip7"><rect x="44" y="585" width="0" height="28"><animate attributeName="width" from="0" to="970" dur="1.2s" begin="8.8s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- ambient blue glow -->
  <ellipse cx="885" cy="108" rx="220" ry="120" fill="#2563EB" opacity="0.10" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.07;0.16;0.07" dur="5.5s" repeatCount="indefinite"/>
  </ellipse>

  <rect x="10" y="10" width="1080" height="630" rx="18" fill="#070A0F"/>
  <rect x="10.75" y="10.75" width="1078.5" height="628.5" rx="17.25" stroke="url(#border)" stroke-opacity="0.82" stroke-width="1.5"/>
  <rect x="11" y="11" width="1078" height="628" rx="17" fill="url(#glow)"/>

  <!-- top bar -->
  <line x1="10" y1="60" x2="1090" y2="60" stroke="#1B2638"/>
  <circle cx="38" cy="35" r="5" fill="#64748B"/>
  <circle cx="58" cy="35" r="5" fill="#64748B" opacity="0.8"/>
  <circle cx="78" cy="35" r="5" fill="#64748B" opacity="0.6"/>
  <text x="104" y="41" fill="#8DA2BC" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">youmna@cairo:~</text>
  <circle cx="980" cy="35" r="4" fill="#22D3EE">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="995" y="41" fill="#7DD3FC" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">exploring</text>

  <!-- WHOAMI -->
  <g clip-path="url(#clip1)">
    <text x="44" y="107" fill="#60A5FA" font-size="19" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">youmna@cairo:~$</text>
    <text x="224" y="107" fill="#E6EDF3" font-size="19" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">whoami</text>
  </g>
  <g clip-path="url(#clip2)">
    <text x="66" y="148" fill="#F8FAFC" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">Youmna Mohamed</text>
    <text x="66" y="178" fill="#C9D7E7" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">Computer Engineering student @ Cairo University</text>
    <text x="66" y="208" fill="#C9D7E7" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">exploring backend engineering &amp; the systems behind it</text>
  </g>

  <!-- STACK -->
  <g clip-path="url(#clip3)">
    <text x="44" y="257" fill="#60A5FA" font-size="19" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">youmna@cairo:~$</text>
    <text x="224" y="257" fill="#E6EDF3" font-size="19" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">stack --group-by layer</text>
  </g>
  <g clip-path="url(#clip4)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="17">
    <text x="66" y="298" fill="#7DD3FC" font-weight="700">languages</text>
    <text x="184" y="298" fill="#C9D7E7">C · C++ · Python · JavaScript · TypeScript</text>

    <text x="66" y="328" fill="#7DD3FC" font-weight="700">backend</text>
    <text x="184" y="328" fill="#C9D7E7">Node.js · NestJS · Express · REST APIs</text>

    <text x="66" y="358" fill="#7DD3FC" font-weight="700">data</text>
    <text x="184" y="358" fill="#C9D7E7">PostgreSQL · MongoDB · Prisma</text>

    <text x="66" y="388" fill="#7DD3FC" font-weight="700">tools</text>
    <text x="184" y="388" fill="#C9D7E7">Docker · Postman</text>
  </g>

  <!-- FOCUS -->
  <g clip-path="url(#clip5)">
    <text x="44" y="453" fill="#60A5FA" font-size="19" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">youmna@cairo:~$</text>
    <text x="224" y="453" fill="#E6EDF3" font-size="19" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">cat current_focus.txt</text>
  </g>
  <g clip-path="url(#clip6)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="17">
    <text x="66" y="494" fill="#C9D7E7">Backend Engineering · Databases · SQL · Node.js Internals</text>
    <text x="66" y="524" fill="#C9D7E7">NestJS · System Design · Docker · Problem Solving</text>
  </g>

  <!-- FINAL PROMPT -->
  <g clip-path="url(#clip7)">
    <text x="44" y="606" fill="#60A5FA" font-size="19" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">youmna@cairo:~$</text>
    <rect x="224" y="590" width="10" height="20" rx="1" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
